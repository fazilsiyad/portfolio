<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faizi is cooking 🚧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      /* Full-screen background image */
      background: #d9d9d9 url("background.jpg") center center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .message {
      font-family: "Bungee", Impact, "Arial Black", sans-serif;
      font-size: clamp(2rem, 7vw, 5.5rem);
      color: #ffd21f;
      text-align: center;
      padding: 0.4em 0.8em;
      background: rgba(20, 20, 20, 0.75);
      border-radius: 8px;
      text-shadow: 3px 3px 0 #000;
      animation: blink 2.5s ease-in-out infinite;
    }

    /* Slow, smooth blink */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }

    /* Turn off blinking for people who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .message { animation: none; }
    }
  </style>
</head>
<body>
  <h1 class="message">Faizi is cooking</h1>
</body>
</html>
